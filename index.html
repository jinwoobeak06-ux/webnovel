<!DOCTYPE html>
<html lang="ko" data-ink="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>먹과종이 웹소설</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Black+Han+Sans&family=Nanum+Pen+Script&family=Do+Hyeon&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet">
<style>
/* 여백 넉넉한 흰 화면 + 둥근 카드. 흑백 반전 버튼은 전체 색을 뒤집는다. 작품 화면은 왼쪽 작품 정보 / 오른쪽 전체 회차 목록. */
:root{
  --bg:#ffffff; --soft:#f4f5f7; --card:#ffffff; --ink:#111214; --sub:#6b7078; --line:#e8e9ec; --heart:#ff3b5c;
  --shadow:0 8px 28px rgba(17,18,20,.08);
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --fs:18px; --r:14px; color-scheme:light;
}
html[data-ink="dark"]{
  --bg:#0e0f11; --soft:#1a1b1f; --card:#16171a; --ink:#f3f4f6; --sub:#9aa0a8; --line:#26282d; --heart:#ff5470;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;letter-spacing:-.01em;transition:background-color .25s,color .25s}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:68px}
.logo{background:none;border:0;padding:0;font-weight:800;font-size:21px;letter-spacing:-.03em;white-space:nowrap}
.logo i{font-style:normal;color:var(--sub);font-weight:500;font-size:13px;margin-left:6px}
.search{flex:1;max-width:380px}
.search input{width:100%;border:1px solid transparent;background:var(--soft);padding:10px 18px;border-radius:999px}
.search input:focus{outline:none;border-color:var(--ink)}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.lnk{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--sub)}
.lnk:hover{color:var(--ink);background:var(--soft)}
.lnk[aria-current="true"]{color:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.btn{background:var(--ink);color:var(--bg);border:0;padding:10px 18px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.45;transform:none;cursor:default}
.btn-soft{background:var(--soft);color:var(--ink);border:0;padding:10px 18px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-soft:hover{background:var(--line)}
.btn-text{background:none;border:0;padding:8px 6px;color:var(--sub);font-weight:500}
.btn-text:hover{color:var(--ink)}
.btn-lg{width:100%;padding:15px 20px;font-size:16px}
.g{width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.me{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:0;padding:5px 14px 5px 5px;border-radius:999px;font-weight:600}
.me img,.me .av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800}

/* home */
.hero{margin-top:32px;background:var(--soft);border-radius:28px;padding:44px;display:grid;grid-template-columns:200px 1fr;gap:44px;align-items:center}
.kick{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.kick b{background:var(--ink);color:var(--bg);padding:3px 10px;border-radius:999px;font-size:12px}
.hero h1{font-size:38px;font-weight:800;letter-spacing:-.035em;margin:14px 0 6px}
.hero .by{color:var(--sub);margin-bottom:16px}
.hero p{max-width:58ch;margin:0 0 26px;color:var(--sub);line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:40px}
.chip{background:var(--card);border:1px solid var(--line);padding:7px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--sub)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sec{margin-top:60px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sec-h h2{font-size:24px;font-weight:800;letter-spacing:-.03em}
.sec-h .d{color:var(--sub);font-size:14px}
.sec-h .end{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:40px 24px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.cv{position:relative;aspect-ratio:5/7;border-radius:12px;overflow:hidden;background:var(--soft);box-shadow:0 1px 0 var(--line);transition:transform .2s,box-shadow .2s}
.card:hover .cv{transform:translateY(-4px);box-shadow:var(--shadow)}
.cv img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;background:var(--ink);color:var(--bg);display:flex;align-items:flex-end;padding:16px;font-weight:800;font-size:18px;line-height:1.3;word-break:keep-all}
.rank{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 6px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-weight:900;font-size:40px;line-height:1;font-style:italic;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ct{font-weight:700;font-size:15px;line-height:1.4;margin-top:10px;word-break:keep-all}
.cm{color:var(--sub);font-size:13px}
.cs{display:flex;gap:6px;font-size:12px;color:var(--sub);align-items:center;flex-wrap:wrap}
.hc{color:var(--heart);font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ink);color:var(--bg)}
.pill.off{background:var(--soft);color:var(--sub)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:72px 0 24px}
.info div{background:var(--soft);border-radius:18px;padding:22px 24px}
.info b{display:block;font-size:18px;font-weight:800;margin-bottom:4px}
.info span{color:var(--sub);font-size:14px}
.empty{background:var(--soft);border-radius:20px;padding:56px 24px;text-align:center;color:var(--sub)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:8px}
.empty .row{justify-content:center;margin-top:22px}
.more{display:flex;justify-content:center;margin-top:32px}

/* novel page */
.novel{display:grid;grid-template-columns:300px 1fr;gap:64px;padding:44px 0 40px;align-items:start}
.side{position:sticky;top:100px;display:flex;flex-direction:column;gap:18px}
.side .cv{box-shadow:var(--shadow)}
.side h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.meta{display:flex;gap:14px;color:var(--sub);flex-wrap:wrap;font-size:14px}
.syn{color:var(--sub);line-height:1.8;white-space:pre-wrap;word-break:keep-all}
.heart{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1.5px solid var(--heart);color:var(--heart);padding:9px 18px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.heart svg{width:18px;height:18px}
.heart[aria-pressed="true"]{background:var(--heart);color:#fff}
.side .row .btn,.side .row .btn-soft,.side .row .heart{flex:1}
.eph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.eph h2{font-size:22px;font-weight:800}
.eph .n{color:var(--sub);font-weight:600}
.seg{margin-left:auto;display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.eps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ep{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;background:none;border:0;border-radius:14px;padding:16px 18px;text-align:left}
.ep:hover{background:var(--soft)}
.ep .no{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.ep:hover .no{background:var(--card)}
.ep .t{font-weight:600}
.ep .dt{display:block;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.ep .go{color:var(--sub);font-size:13px;font-weight:600}
.ep.last .no{background:var(--ink);color:var(--bg)}
.warn{background:var(--soft);border-radius:14px;padding:14px 18px;font-size:14px}

/* reader */
.reader{max-width:700px;margin:0 auto;padding:36px 0 80px}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fs{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.fs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700}
.fs button:hover{background:var(--card)}
.reader .lbl{margin-top:48px;color:var(--sub);font-weight:600;font-size:14px}
.reader h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:6px 0 48px}
.prose{font-family:var(--serif);font-size:var(--fs);line-height:2;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.rend{margin-top:72px;background:var(--soft);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.pn{display:flex;gap:10px;width:100%;justify-content:space-between;flex-wrap:wrap}

/* forms */
.form{max-width:820px;padding:44px 0 80px}
.form h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.form .lead{color:var(--sub);margin:0 0 36px}
.f2{display:grid;grid-template-columns:220px 1fr;gap:40px}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.fld label{font-weight:700;font-size:14px}
.fld .h{color:var(--sub);font-weight:400;font-size:13px}
.fld input,.fld textarea,.fld select{border:1.5px solid transparent;background:var(--soft);padding:13px 16px;border-radius:12px;width:100%}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ink);outline:none;background:var(--card)}
.fld textarea{resize:vertical}
#epBody{min-height:460px;font-family:var(--serif);font-size:16px;line-height:1.9}
.drop{position:relative;aspect-ratio:5/7;border:2px dashed var(--line);border-radius:14px;background:var(--soft);display:grid;place-items:center;text-align:center;color:var(--sub);font-size:13px;overflow:hidden;cursor:pointer;padding:12px}
.drop:hover{border-color:var(--sub)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop.has{border-style:solid;border-color:transparent}
.cc{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12px;text-align:right}

/* library */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:40px}
.stats div{background:var(--soft);border-radius:18px;padding:22px 24px}
.stats b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{color:var(--sub);font-size:14px}
.lib{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lib li{display:grid;grid-template-columns:72px 1fr auto;gap:20px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--line)}
.lib .t{font-weight:700;font-size:16px;margin-bottom:2px}

/* modal / toast / setup */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px;z-index:50}
.panel{background:var(--bg);border-radius:24px;width:100%;max-width:420px;padding:36px;box-shadow:var(--shadow)}
.panel h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.panel p{color:var(--sub);margin:0 0 24px}
.panel .fine{font-size:13px;margin:16px 0 0;text-align:center}
.panel .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.setup{max-width:760px;margin:48px auto 80px;background:var(--soft);border-radius:24px;padding:40px}
.setup h1{font-size:26px;font-weight:800;margin-bottom:10px}
.setup ol{padding-left:20px;line-height:1.9}
.setup code,.setup pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.setup pre{background:var(--card);border-radius:12px;padding:16px;overflow-x:auto;max-height:260px}
.foot{color:var(--sub);font-size:13px;padding:40px 0 48px;margin-top:64px;border-top:1px solid var(--line)}

/* episode tiles + inline writer */
.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.eptile{border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,transform .15s}
.eptile:hover{border-color:var(--ink);transform:translateY(-2px)}
.eptile.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.eptile .tmain{background:none;border:0;text-align:left;padding:16px 16px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.eptile b{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.eptile span{font-size:13px;line-height:1.4;word-break:keep-all}
.eptile small{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.eptile .tedit{border:0;border-top:1px solid var(--line);background:none;padding:8px;font-size:12px;font-weight:600;color:var(--sub)}
.eptile .tedit:hover{color:var(--ink);background:var(--soft)}
.eptile.add{border-style:dashed;border-width:2px;background:transparent}
.eptile.add .tmain{align-items:center;justify-content:center;text-align:center;min-height:96px}
.writer{margin-top:28px;border-radius:20px;background:var(--card);border:1.5px solid var(--ink);padding:24px 28px;scroll-margin-top:90px}
.writer .wh{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.wno{font-weight:800;font-size:28px;letter-spacing:-.03em;white-space:nowrap}
#epTitle{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:600;padding:6px 0;outline:none}
#epBody{width:100%;min-height:60vh;border:0;background:transparent;resize:vertical;font-family:var(--serif);font-size:17px;line-height:1.95;outline:none;padding:0}
.wf{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.wf .btn-text{margin-left:auto}

/* auth tabs, cover buttons */
[hidden]{display:none!important}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:24px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:999px;font-weight:600;color:var(--sub)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.coverbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.coverbtns .btn,.coverbtns .btn-soft{padding:10px 6px;justify-content:center;cursor:pointer;font-size:14px}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* painter */
.pt{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto 1fr}
.pt-top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.pt-top b{font-size:17px;font-weight:800}
.pt-hist{display:flex;gap:6px;margin:0 auto}
.pt-hist button{border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.pt-hist button[disabled]{opacity:.4;cursor:default}
.pt-body{display:grid;grid-template-columns:84px 1fr 296px;min-height:0}
.pt-tools{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-right:1px solid var(--line);overflow-y:auto}
.pt-tools button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:12px;padding:7px 2px;font-size:11px;color:var(--sub);flex:0 0 auto}
.pt-tools button:hover{background:var(--soft);color:var(--ink)}
.pt-tools svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pt-tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pt-stage{background:var(--soft);position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pt-wrap{position:relative;background:#fff;box-shadow:var(--shadow);border-radius:4px;overflow:hidden;flex:0 0 auto}
.pt-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
#ptOver{touch-action:none;cursor:crosshair}
.pt-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(40,120,255,.35) 1px,transparent 1px),linear-gradient(to bottom,rgba(40,120,255,.35) 1px,transparent 1px);background-size:33.333% 33.333%}
.pt-grid::after{content:"";position:absolute;inset:7%;border:1px dashed rgba(40,120,255,.55)}
.pt-cur{position:absolute;border-radius:50%;border:1px solid rgba(0,0,0,.75);box-shadow:0 0 0 1px rgba(255,255,255,.75);pointer-events:none;transform:translate(-50%,-50%);display:none}
.pt-side{border-left:1px solid var(--line);overflow-y:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:20px}
.pt-side h4{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.pt-side h4 output{color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
.pt-side input[type=range]{width:100%;accent-color:var(--ink);margin:0 0 10px}
.pt-side select,.pt-side textarea,.pt-side .hex{width:100%;border:1.5px solid transparent;background:var(--soft);border-radius:10px;padding:9px 12px}
.pt-side textarea{resize:vertical;margin-bottom:8px}
.pt-side select{margin-bottom:10px}
.pt-colrow{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.pt-cc{position:relative;width:80px;height:66px;flex:0 0 auto}
.pt-cc input{position:absolute;width:46px;height:46px;border:3px solid var(--bg);border-radius:12px;padding:0;box-shadow:0 0 0 1px var(--line);cursor:pointer;background:none}
.pt-cc input::-webkit-color-swatch-wrapper{padding:0}
.pt-cc input::-webkit-color-swatch{border:none;border-radius:9px}
.pt-cc input::-moz-color-swatch{border:none;border-radius:9px}
#ptC1{left:0;top:0;z-index:2}#ptC2{left:28px;top:20px}
.pt-cc button{position:absolute;right:0;top:-2px;border:0;background:none;font-size:14px;color:var(--sub);padding:2px}
.pt-colrow .hex{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;text-transform:uppercase}
.pt-pal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.cp{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.cp canvas{width:100%;border-radius:10px;cursor:crosshair;touch-action:none;display:block}
#cpSV{aspect-ratio:256/160}#cpH{height:16px;border-radius:999px}
.cp-rgb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

<script type="module">
/* ================================================================
   (선택) Firebase 설정 — 비워 두면 설치 없이 이 브라우저에 저장되는 모드로 작동해요.
   여러 사람이 같은 작품을 보게 하려면 Firebase 값을 넣으세요.
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "여기에_apiKey",
  authDomain: "여기에_프로젝트ID.firebaseapp.com",
  projectId: "여기에_프로젝트ID",
  storageBucket: "여기에_프로젝트ID.appspot.com",
  messagingSenderId: "여기에_숫자",
  appId: "여기에_appId"
};
/* ================================================================ */


const GENRES=["판타지","현대판타지","로맨스","로맨스판타지","무협","미스터리·스릴러","공포","SF","드라마","기타"];
const WEEK=7*864e5;
const $=s=>document.querySelector(s);
const app=$("#app");
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.8 8 3 4 6.9 4c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3C21 4 23.2 8 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>';
const CONFIGURED=!/^여기에/.test(FIREBASE_CONFIG.apiKey);

const S={auth:null,db:null,user:null,uid:null,pen:"",authReady:false,
  novels:{},week:{},mine:new Set(),loaded:false,err:false,
  view:{name:"home"},genre:"전체",q:"",freshLimit:12,epOrder:"asc",read:null,draft:null,epDraft:null,busy:false,after:null};

/* ---------- utils ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeImg=u=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(String(u||""))?u:"";
const safeHttps=u=>/^https:\/\/[^\s"'<>]+$/.test(String(u||""))?u:"";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtN=n=>Number(n||0).toLocaleString("ko-KR");
function fmtD(t){if(!t)return "";const d=new Date(t);return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}
function errMsg(e){const c=String(e&&e.code||"");
  if(c.includes("permission"))return "권한이 없어요. Firestore 보안 규칙을 확인해 주세요.";
  if(c.includes("email-already-in-use"))return "이미 있는 아이디예요. 다른 아이디를 써 주세요.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")||c.includes("invalid-login"))return "아이디 또는 비밀번호가 틀렸어요.";
  if(c.includes("weak-password"))return "비밀번호는 6자 이상이어야 해요.";
  if(c.includes("too-many-requests"))return "시도가 너무 많아요. 잠시 후 다시 해 주세요.";
  if(c.includes("operation-not-allowed"))return "Firebase에서 이메일/비밀번호 로그인을 켜 주세요.";
  if(c.includes("unavailable")||c.includes("network"))return "인터넷 연결을 확인해 주세요.";
  if(c.includes("quota")||String(e&&e.name).includes("Quota"))return "이 브라우저 저장 공간이 가득 찼어요.";
  return "문제가 생겼어요. 잠시 후 다시 시도해 주세요.";}

/* ---------- 흑백 반전 & 글자 크기 ---------- */
function setInk(m,save){document.documentElement.setAttribute("data-ink",m);if(save)lsSet("mj_ink",m);$("#themeBtn").setAttribute("aria-pressed",String(m==="dark"));}
setInk(lsGet("mj_ink")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),false);
function setFs(n){n=Math.max(14,Math.min(26,n));document.documentElement.style.setProperty("--fs",n+"px");S.fs=n;lsSet("mj_fs",String(n));}
setFs(parseInt(lsGet("mj_fs")||"18",10)||18);

/* ---------- data ---------- */
function epList(d){return (Array.isArray(d.episodes)?d.episodes:[]).filter(e=>e&&typeof e.id==="string").map((e,i)=>({id:e.id,no:i+1,title:String(e.title||"").slice(0,80),at:Number(e.at)||0}));}
function allNovels(){return Object.entries(S.novels).map(([id,d])=>{const eps=epList(d);return {id,aid:String(d.authorId||""),pen:String(d.penName||"익명 작가").slice(0,20),
  title:String(d.title||"제목 없음").slice(0,60),genre:GENRES.includes(d.genre)?d.genre:"기타",synopsis:String(d.synopsis||"").slice(0,400),cover:safeImg(d.cover),
  eps,epCount:eps.length,hearts:Math.max(0,Number(d.heartCount)||0),week:S.week[id]||0,updated:Number(d.updatedAt)||0};});}
const findNovel=id=>allNovels().find(n=>n.id===id);
const byPop=(a,b)=>b.hearts-a.hearts||b.week-a.week||b.updated-a.updated;
const liked=id=>S.mine.has(id);

/* ---------- pieces ---------- */
const coverHtml=n=>n.cover?`<img src="${esc(n.cover)}" alt="${esc(n.title)} 표지" loading="lazy">`:`<div class="ph"><span>${esc(n.title)}</span></div>`;
const card=(n,rank)=>`<button class="card" type="button" data-act="open" data-id="${esc(n.id)}">
  <div class="cv">${coverHtml(n)}${rank?`<span class="rank">${rank}</span>`:""}</div>
  <div class="ct">${esc(n.title)}</div><div class="cm">${esc(n.pen)}</div>
  <div class="cs"><span>${esc(n.genre)}</span><span>·</span><span>${n.epCount?n.epCount+"화":"연재 준비 중"}</span><span class="hc">♥ <span data-hc="${esc(n.id)}">${fmtN(n.hearts)}</span></span></div></button>`;
const heartBtn=n=>{const on=liked(n.id);return `<button class="heart" type="button" data-act="heart" data-id="${esc(n.id)}" data-hb="${esc(n.id)}" aria-pressed="${on}">${HEART}<span data-hl>${on?"하트 취소":"하트"}</span><span data-hc="${esc(n.id)}">${fmtN(n.hearts)}</span></button>`;};

/* ---------- 저장소 ----------
   FIREBASE_CONFIG를 채우면 온라인(모든 사람이 같이 보는) 저장소를 쓰고,
   비워 두면 설치·설정 없이 이 브라우저 안(IndexedDB)에 저장하는 체험 모드로 바로 작동해요. */
const FB_V="10.12.2";
async function makeFirebaseAPI(){
  const [{initializeApp},A,F]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`)]);
  const app=initializeApp(FIREBASE_CONFIG),auth=A.getAuth(app),db=F.getFirestore(app);
  const {doc,collection,getDoc,setDoc,updateDoc,onSnapshot,query,where,limit,writeBatch,increment}=F;
  return {online:true,
    newId:()=>doc(collection(db,"novels")).id,
    onAuth:cb=>A.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,loginId:(u.email||"").split("@")[0]}:null)),
    signUp:async(id,pw)=>(await A.createUserWithEmailAndPassword(auth,idMail(id),pw)).user.uid,
    signIn:async(id,pw)=>{await A.signInWithEmailAndPassword(auth,idMail(id),pw);},
    signOut:()=>A.signOut(auth),
    getUser:async uid=>{const d=await getDoc(doc(db,"users",uid));return d.exists()?d.data():null;},
    setUser:(uid,data)=>setDoc(doc(db,"users",uid),data),
    watchNovels:(cb,err)=>onSnapshot(query(collection(db,"novels"),limit(500)),s=>{const m={};s.forEach(d=>m[d.id]=d.data());cb(m);},err),
    watchWeek:cb=>onSnapshot(query(collection(db,"hearts"),where("createdAt",">=",Date.now()-WEEK)),s=>{const w={};s.forEach(d=>{const n=d.data().nid;if(n)w[n]=(w[n]||0)+1;});cb(w);},()=>{}),
    watchMine:(uid,cb)=>onSnapshot(query(collection(db,"hearts"),where("uid","==",uid)),s=>{const set=new Set();s.forEach(d=>set.add(d.data().nid));cb(set);},()=>{}),
    createNovel:(id,data)=>setDoc(doc(db,"novels",id),data),
    updateNovel:(id,data)=>updateDoc(doc(db,"novels",id),data),
    updateNovels:async(ids,data)=>{if(!ids.length)return;const b=writeBatch(db);ids.forEach(id=>b.update(doc(db,"novels",id),data));await b.commit();},
    deleteNovel:async(id,eids)=>{const b=writeBatch(db);eids.forEach(e=>b.delete(doc(db,"novels",id,"episodes",e)));b.delete(doc(db,"novels",id));await b.commit();},
    getEpisode:async(nid,eid)=>{const d=await getDoc(doc(db,"novels",nid,"episodes",eid));return d.exists()?d.data():null;},
    saveEpisode:async(nid,eid,ep,upd)=>{const b=writeBatch(db);b.set(doc(db,"novels",nid,"episodes",eid),ep);b.update(doc(db,"novels",nid),upd);await b.commit();},
    deleteEpisode:async(nid,eid,upd)=>{const b=writeBatch(db);b.delete(doc(db,"novels",nid,"episodes",eid));b.update(doc(db,"novels",nid),upd);await b.commit();},
    heart:async(uid,nid,on)=>{const b=writeBatch(db),hid=uid+"_"+nid;
      if(on){b.set(doc(db,"hearts",hid),{uid,nid,createdAt:Date.now()});b.update(doc(db,"novels",nid),{heartCount:increment(1)});}
      else{b.delete(doc(db,"hearts",hid));b.update(doc(db,"novels",nid),{heartCount:increment(-1)});}await b.commit();}};}

function makeLocalAPI(){
  /* IndexedDB 키-값 저장소 (안 되면 메모리) */
  let kv;
  const idbOpen=new Promise(res=>{try{const r=indexedDB.open("mukgwajongi",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const mem=new Map();
  kv={get:async k=>{const d=await idbOpen;return d?req(d.transaction("kv").objectStore("kv").get(k)):mem.get(k);},
      put:async(k,v)=>{const d=await idbOpen;if(!d){mem.set(k,v);return;}const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||{code:"quota"});});},
      del:async k=>{const d=await idbOpen;if(!d){mem.delete(k);return;}const t=d.transaction("kv","readwrite");t.objectStore("kv").delete(k);await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);});},
      all:async pre=>{const d=await idbOpen;if(!d)return [...mem].filter(([k])=>k.startsWith(pre));const s=d.transaction("kv").objectStore("kv"),rg=IDBKeyRange.bound(pre,pre+"￿");const [ks,vs]=await Promise.all([req(s.getAllKeys(rg)),req(s.getAll(rg))]);return ks.map((k,i)=>[k,vs[i]]);}};
  const L={novels:new Set(),week:new Set(),mine:new Set()};let authCb=null;
  const bc=("BroadcastChannel" in window)?new BroadcastChannel("mukgwajongi"):null;
  async function emit(){const ns=await kv.all("novel:"),hs=await kv.all("heart:"),m={},w={},now=Date.now();
    ns.forEach(([k,v])=>m[k.slice(6)]=v);hs.forEach(([,v])=>{if(now-v.createdAt<WEEK)w[v.nid]=(w[v.nid]||0)+1;});
    L.novels.forEach(cb=>cb(m));L.week.forEach(cb=>cb(w));L.mine.forEach(x=>{const s=new Set();hs.forEach(([,v])=>{if(v.uid===x.uid)s.add(v.nid);});x.cb(s);});}
  const changed=()=>{emit();if(bc)bc.postMessage(1);};
  if(bc)bc.onmessage=()=>emit();
  async function hashPw(pw,salt){if(!(window.crypto&&crypto.subtle)){let h=0;for(const c of salt+pw)h=(h*31+c.charCodeAt(0))|0;return "s"+h;}
    const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:100000,hash:"SHA-256"},k,256);
    return btoa(String.fromCharCode(...new Uint8Array(b)));}
  const sess=()=>{try{return JSON.parse(localStorage.getItem("mj_session")||"null");}catch(e){return null;}};
  const setSess=v=>{lsSet("mj_session",v?JSON.stringify(v):null);if(authCb)authCb(v);};
  const updNovel=async(id,data)=>{const v=await kv.get("novel:"+id);if(!v)throw {code:"not-found"};Object.assign(v,data);await kv.put("novel:"+id,v);};
  return {online:false,newId:genId,
    onAuth:cb=>{authCb=cb;setTimeout(()=>cb(sess()),0);window.addEventListener("storage",e=>{if(e.key==="mj_session")cb(sess());});},
    signUp:async(id,pw)=>{if(await kv.get("acct:"+id))throw {code:"auth/email-already-in-use"};const uid="u"+genId(),salt=genId();
      await kv.put("acct:"+id,{uid,salt,hash:await hashPw(pw,salt)});setSess({uid,loginId:id});return uid;},
    signIn:async(id,pw)=>{const a=await kv.get("acct:"+id);if(!a||a.hash!==await hashPw(pw,a.salt))throw {code:"auth/invalid-credential"};setSess({uid:a.uid,loginId:id});},
    signOut:async()=>setSess(null),
    getUser:uid=>kv.get("user:"+uid),
    setUser:(uid,data)=>kv.put("user:"+uid,data),
    watchNovels:(cb,err)=>{L.novels.add(cb);emit().catch(err);return ()=>L.novels.delete(cb);},
    watchWeek:cb=>{L.week.add(cb);emit().catch(()=>{});return ()=>L.week.delete(cb);},
    watchMine:(uid,cb)=>{const x={uid,cb};L.mine.add(x);emit().catch(()=>{});return ()=>L.mine.delete(x);},
    createNovel:async(id,data)=>{await kv.put("novel:"+id,data);changed();},
    updateNovel:async(id,data)=>{await updNovel(id,data);changed();},
    updateNovels:async(ids,data)=>{for(const id of ids)await updNovel(id,data);changed();},
    deleteNovel:async(id,eids)=>{for(const e of eids)await kv.del("ep:"+id+":"+e);await kv.del("novel:"+id);changed();},
    getEpisode:(nid,eid)=>kv.get("ep:"+nid+":"+eid),
    saveEpisode:async(nid,eid,ep,upd)=>{await kv.put("ep:"+nid+":"+eid,ep);await updNovel(nid,upd);changed();},
    deleteEpisode:async(nid,eid,upd)=>{await kv.del("ep:"+nid+":"+eid);await updNovel(nid,upd);changed();},
    heart:async(uid,nid,on)=>{const k="heart:"+uid+"_"+nid,v=await kv.get("novel:"+nid);if(!v)throw {code:"not-found"};
      if(on){if(await kv.get(k))return;await kv.put(k,{uid,nid,createdAt:Date.now()});v.heartCount=(Number(v.heartCount)||0)+1;}
      else{if(!await kv.get(k))return;await kv.del(k);v.heartCount=Math.max(0,(Number(v.heartCount)||0)-1);}
      await kv.put("novel:"+nid,v);changed();}};}

/* ---------- views ---------- */
function vHome(){
  if(!S.loaded)return `<div class="sec"><div class="empty">${S.err?"작품을 불러오지 못했어요. 새로고침해 주세요.":"작품을 불러오는 중이에요…"}</div></div>`;
  const all=allNovels(),f=n=>S.genre==="전체"||n.genre===S.genre;
  const live=all.filter(n=>n.epCount>=1),pending=all.length-live.length;
  const pop=live.filter(f).sort(byPop);
  const rising=live.filter(f).filter(n=>n.week>0).sort((a,b)=>b.week-a.week||b.hearts-a.hearts);
  const fresh=live.filter(f).sort((a,b)=>b.updated-a.updated);
  let taste=[];if(S.uid){const gc={};all.forEach(n=>{if(liked(n.id))gc[n.genre]=(gc[n.genre]||0)+1;});
    const fav=Object.keys(gc).sort((a,b)=>gc[b]-gc[a]).slice(0,2);if(fav.length)taste=live.filter(n=>fav.includes(n.genre)&&!liked(n.id)&&n.aid!==S.uid).sort(byPop).slice(0,6);}
  let h="";const top=pop[0];
  if(top)h+=`<section class="hero"><button class="card" type="button" data-act="open" data-id="${esc(top.id)}" aria-label="${esc(top.title)} 열기"><div class="cv">${coverHtml(top)}</div></button>
    <div><div class="kick"><b>${top.hearts>0?"인기 1위":"신작"}</b>${esc(top.genre)} · ${top.epCount}화</div><h1>${esc(top.title)}</h1><div class="by">${esc(top.pen)}</div>
    <p>${esc(top.synopsis||"작품 소개가 아직 없어요.")}</p><div class="row"><button class="btn" type="button" data-act="open" data-id="${esc(top.id)}">작품 보기</button>${heartBtn(top)}</div></div></section>`;
  h+=`<div class="chips">${["전체"].concat(GENRES).map(g=>`<button class="chip" type="button" data-act="genre" data-g="${esc(g)}" aria-pressed="${S.genre===g}">${esc(g)}</button>`).join("")}</div>`;
  if(!live.length)h+=`<div class="sec"><div class="empty"><h3>아직 연재 중인 작품이 없어요</h3>표지와 제목으로 작품을 등록하고 1화를 올리면 인기 소설에 바로 올라와요.<div class="row"><button class="btn" type="button" data-act="newnovel">첫 작품 등록하기</button></div></div></div>`;
  else{
    h+=`<section class="sec"><div class="sec-h"><h2>인기 소설</h2><span class="d">하트를 많이 받은 순서</span></div>${pop.length?`<div class="grid">${pop.slice(0,10).map((n,i)=>card(n,i+1)).join("")}</div>`:`<div class="empty">이 장르에는 아직 연재 중인 작품이 없어요.</div>`}</section>`;
    if(rising.length)h+=`<section class="sec"><div class="sec-h"><h2>이번 주 급상승</h2><span class="d">최근 7일 하트 순서</span></div><div class="grid">${rising.slice(0,6).map(n=>card(n)).join("")}</div></section>`;
    if(taste.length)h+=`<section class="sec"><div class="sec-h"><h2>취향 저격</h2><span class="d">하트 누른 작품과 같은 장르</span></div><div class="grid">${taste.map(n=>card(n)).join("")}</div></section>`;
    h+=`<section class="sec"><div class="sec-h"><h2>최신 연재</h2><span class="d">새 회차가 올라온 순서</span></div>${fresh.length?`<div class="grid">${fresh.slice(0,S.freshLimit).map(n=>card(n)).join("")}</div>`:`<div class="empty">이 장르에는 아직 연재 중인 작품이 없어요.</div>`}${fresh.length>S.freshLimit?`<div class="more"><button class="btn-soft" type="button" data-act="more">더 보기</button></div>`:""}</section>`;}
  h+=`<div class="info"><div><b>하트 1개 = 1점</b><span>하트를 많이 받을수록 인기 소설 위쪽에 떠요.</span></div><div><b>최근 7일</b><span>이번 주 하트는 급상승 목록에 반영돼요.</span></div><div><b>회차 1개 이상</b><span>회차가 없는 작품은 추천 목록에 뜨지 않아요.${pending?` 지금 ${pending}개 대기 중.`:""}</span></div></div>`;
  return h;}

function vSearch(){const q=S.q.toLowerCase();const r=allNovels().filter(n=>(n.title+" "+n.pen+" "+n.synopsis).toLowerCase().includes(q)).sort(byPop);
  return `<section class="sec"><div class="sec-h"><h2>‘${esc(S.q)}’ 검색 결과</h2><span class="d">${r.length}개</span></div>${r.length?`<div class="grid">${r.map(n=>card(n)).join("")}</div>`:`<div class="empty">찾는 작품이 없어요. 다른 단어로 검색해 보세요.</div>`}</section>`;}

function vNovel(){const n=findNovel(S.view.id);if(!n)return notFound();const mine=n.aid===S.uid;const w=S.epDraft&&S.epDraft.id===n.id?S.epDraft:null;
  return `<div class="novel"><aside class="side"><div class="cv">${coverHtml(n)}</div>
   <div class="row">${n.epCount?`<span class="pill">연재 중</span>`:`<span class="pill off">연재 준비 중</span>`}<span class="cm">${esc(n.genre)}</span></div>
   <h1>${esc(n.title)}</h1>
   <div class="meta"><span>${esc(n.pen)}</span><span>총 ${n.epCount}화</span><span>♥ <span data-hc="${esc(n.id)}">${fmtN(n.hearts)}</span></span></div>
   <div class="syn">${esc(n.synopsis||"작품 소개가 아직 없어요.")}</div>
   <div class="row">${n.epCount?`<button class="btn" type="button" data-act="read" data-id="${esc(n.id)}" data-eid="${esc(n.eps[0].id)}">1화부터 보기</button>`:""}${mine?"":heartBtn(n)}</div>
   ${mine?`<div class="row"><button class="btn${n.epCount?"-soft":""}" type="button" data-act="newep" data-id="${esc(n.id)}">+ ${n.epCount+1}화 쓰기</button><button class="btn-soft" type="button" data-act="editnovel" data-id="${esc(n.id)}">작품 수정</button></div>`:""}
   ${mine&&!n.epCount?`<div class="warn"><b>1화를 올려야</b> 인기 소설·최신 연재에 올라가요.</div>`:""}
  </aside>
  <section><div class="eph"><h2>회차</h2><span class="n">총 ${n.epCount}화</span></div>
   ${n.epCount||mine?`<div class="epgrid">${n.eps.map(e=>`<div class="eptile${w&&w.eid===e.id?" on":""}"><button class="tmain" type="button" data-act="read" data-id="${esc(n.id)}" data-eid="${esc(e.id)}"><b>${e.no}화</b><span>${esc(e.title||"")}</span><small>${fmtD(e.at)}</small></button>${mine?`<button class="tedit" type="button" data-act="editep" data-id="${esc(n.id)}" data-eid="${esc(e.id)}">고치기</button>`:""}</div>`).join("")}
    ${mine?`<div class="eptile add${w&&!w.eid?" on":""}"><button class="tmain" type="button" data-act="newep" data-id="${esc(n.id)}"><b>+ ${n.epCount+1}화</b><span>새로 쓰기</span></button></div>`:""}</div>`:`<div class="empty">아직 올라온 회차가 없어요.</div>`}
   ${w?vWriter(n,w):""}
  </section></div>`;}
function vWriter(n,w){if(w.state==="loading")return `<section class="writer" id="writer"><div class="empty">회차를 불러오는 중이에요…</div></section>`;
  const no=w.eid?(n.eps.find(x=>x.id===w.eid)||{}).no:n.epCount+1;
  return `<section class="writer" id="writer"><form data-form="ep" novalidate>
   <div class="wh"><span class="wno">${no}화</span><input id="epTitle" maxlength="60" value="${esc(w.title||"")}" placeholder="제목 (안 적어도 돼요)" aria-label="${no}화 제목"></div>
   <textarea id="epBody" maxlength="60000" placeholder="여기에 ${no}화 이야기를 써 주세요." aria-label="${no}화 본문">${esc(w.body||"")}</textarea>
   <div class="wf"><span class="cc" id="cc">${fmtN((w.body||"").length)}자</span><span class="cm" id="autosave">쓰는 내용은 이 기기에 자동으로 임시 저장돼요</span>
    <button class="btn-text" type="button" data-act="closewriter">닫기</button><button class="btn" type="submit" id="saveEp">${w.eid?`${no}화 저장`:`${no}화 올리기`}</button></div>
  </form></section>`;}

function vReader(){const n=findNovel(S.view.id);if(!n)return notFound();const i=n.eps.findIndex(e=>e.id===S.view.eid);const ep=n.eps[i];if(!ep)return notFound("회차를 찾을 수 없어요");
  const prev=n.eps[i-1],next=n.eps[i+1],mine=n.aid===S.uid,r=S.read||{};
  const body=r.state==="ok"?`<div class="prose">${esc(String(r.body||""))}</div>`:r.state==="loading"?`<div class="empty">본문을 불러오는 중이에요…</div>`:`<div class="empty">본문을 불러오지 못했어요.</div>`;
  return `<article class="reader"><div class="rbar"><button class="btn-soft" type="button" data-act="open" data-id="${esc(n.id)}">← 회차 목록</button>
   <div class="row">${mine?`<button class="btn-text" type="button" data-act="editep" data-id="${esc(n.id)}" data-eid="${esc(ep.id)}">수정</button><button class="btn-text" type="button" data-act="delep" data-id="${esc(n.id)}" data-eid="${esc(ep.id)}">삭제</button>`:""}
   <div class="fs" role="group" aria-label="글자 크기"><button type="button" data-act="fs-" aria-label="글자 작게">가−</button><button type="button" data-act="fs+" aria-label="글자 크게">가+</button></div></div></div>
   <div class="lbl">${esc(n.title)}${ep.title?" · "+esc(ep.title):""}</div><h1>${ep.no}화</h1>${body}
   <div class="rend">${mine?`<span class="cm">내 작품 · 하트 ${fmtN(n.hearts)}개</span>`:`<span class="cm">재미있었다면 하트를 눌러 주세요. 인기 순위에 반영돼요.</span>${heartBtn(n)}`}
    <div class="pn">${prev?`<button class="btn-soft" type="button" data-act="read" data-id="${esc(n.id)}" data-eid="${esc(prev.id)}">← ${prev.no}화</button>`:"<span></span>"}
    ${next?`<button class="btn" type="button" data-act="read" data-id="${esc(n.id)}" data-eid="${esc(next.id)}">${next.no}화 →</button>`:mine?`<button class="btn" type="button" data-act="newep" data-id="${esc(n.id)}">다음 회차 쓰기</button>`:`<span class="cm">마지막 회차예요</span>`}</div></div></article>`;}

function vWrite(){const d=S.draft||{},edit=!!d.id;
  return `<form class="form" data-form="novel" novalidate><h1>${edit?"작품 수정":"새 작품 등록"}</h1><p class="lead">표지와 소설 이름을 등록하세요. 1화를 올리면 추천 목록에 노출돼요.</p>
   <div class="f2"><div class="fld"><label for="cover">표지 <span class="h">필수</span></label>
     <div class="drop${d.preview?" has":""}">${d.preview?`<img src="${esc(d.preview)}" alt="표지 미리보기">`:`<span>이미지를 올리거나<br>직접 그려 보세요</span>`}<input id="cover" type="file" accept="image/png,image/jpeg,image/webp" aria-label="표지 이미지 선택"></div>
     <div class="coverbtns"><label class="btn-soft" for="cover2">이미지 올리기</label><input id="cover2" class="sr" type="file" accept="image/png,image/jpeg,image/webp"><button class="btn" type="button" data-act="draw">${d.preview?"그려서 고치기":"직접 그리기"}</button></div></div>
    <div><div class="fld"><label for="title">소설 이름 <span class="h">필수 · 40자까지</span></label><input id="title" maxlength="40" value="${esc(d.title||"")}"></div>
     <div class="fld"><label for="genre">장르</label><select id="genre">${GENRES.map(g=>`<option${(d.genre||"판타지")===g?" selected":""}>${esc(g)}</option>`).join("")}</select></div>
     <div class="fld"><label for="syn">작품 소개 <span class="h">300자까지</span></label><textarea id="syn" rows="6" maxlength="300">${esc(d.synopsis||"")}</textarea></div>
     <div class="row"><button class="btn" type="submit" id="saveNovel">${edit?"저장":"작품 등록"}</button><button class="btn-text" type="button" data-act="${edit?"open":"home"}" data-id="${esc(d.id||"")}">취소</button>
      ${edit?`<button class="btn-text" type="button" data-act="delnovel" data-id="${esc(d.id)}" style="margin-left:auto">작품 삭제</button>`:""}</div></div></div></form>`;}

function vEp(){const e=S.epDraft||{},n=findNovel(e.id);if(!n)return notFound();
  if(e.state==="loading")return `<div class="form"><div class="empty">회차를 불러오는 중이에요…</div></div>`;
  const no=e.eid?(n.eps.find(x=>x.id===e.eid)||{}).no:n.epCount+1;
  return `<form class="form" data-form="ep" novalidate><h1>${esc(n.title)} · ${no}화 ${e.eid?"수정":"쓰기"}</h1>
   <p class="lead">${n.epCount===0&&!e.eid?"첫 회차를 올리면 이 작품이 인기 소설·최신 연재에 노출되기 시작해요.":"회차를 올리면 최신 연재 맨 앞으로 올라가요."}</p>
   <div class="fld"><label for="epTitle">회차 제목</label><input id="epTitle" maxlength="60" value="${esc(e.title||"")}" placeholder="${no}화 제목"></div>
   <div class="fld"><label for="epBody">본문 <span class="h">필수</span></label><textarea id="epBody" maxlength="60000">${esc(e.body||"")}</textarea><div class="cc" id="cc">${fmtN((e.body||"").length)}자</div></div>
   <div class="row"><button class="btn" type="submit" id="saveEp">${e.eid?"저장":"회차 등록"}</button><button class="btn-text" type="button" data-act="open" data-id="${esc(n.id)}">취소</button></div></form>`;}

function vLibrary(){if(!S.uid)return `<div class="sec"><div class="empty"><h3>로그인이 필요해요</h3>아이디와 비밀번호만 있으면 바로 연재하고 하트를 누를 수 있어요.<div class="row"><button class="btn" type="button" data-act="login">로그인</button><button class="btn-soft" type="button" data-act="signup">회원가입</button></div></div></div>`;
  const all=allNovels(),mine=all.filter(n=>n.aid===S.uid).sort((a,b)=>b.updated-a.updated),lk=all.filter(n=>liked(n.id));
  return `<div class="stats"><div><b>${mine.length}</b><span>내 작품</span></div><div><b>${fmtN(mine.reduce((s,n)=>s+n.epCount,0))}</b><span>올린 회차</span></div><div><b>${fmtN(mine.reduce((s,n)=>s+n.hearts,0))}</b><span>받은 하트</span></div><div><b>${lk.length}</b><span>하트 누른 작품</span></div></div>
  <section class="sec"><div class="sec-h"><h2>내 작품</h2><span class="end"><button class="btn" type="button" data-act="newnovel">작품 등록</button></span></div>
  ${mine.length?`<ul class="lib">${mine.map(n=>`<li><button class="card" type="button" data-act="open" data-id="${esc(n.id)}" aria-label="${esc(n.title)} 열기"><div class="cv">${coverHtml(n)}</div></button>
   <div><div class="t">${esc(n.title)}</div><div class="cs"><span>${esc(n.genre)}</span><span>·</span><span>${n.epCount}화</span><span>·</span><span style="color:var(--heart);font-weight:700">♥ ${fmtN(n.hearts)}</span></div>
   <div style="margin-top:8px">${n.epCount?`<span class="pill">추천 목록 노출 중</span>`:`<span class="pill off">회차 0개 · 노출 안 됨</span>`}</div></div>
   <div class="row"><button class="btn${n.epCount?"-soft":""}" type="button" data-act="newep" data-id="${esc(n.id)}">${n.epCount?"회차 쓰기":"1화 쓰기"}</button><button class="btn-text" type="button" data-act="editnovel" data-id="${esc(n.id)}">수정</button></div></li>`).join("")}</ul>`:`<div class="empty">아직 등록한 작품이 없어요.</div>`}</section>
  <section class="sec"><div class="sec-h"><h2>하트 누른 작품</h2></div>${lk.length?`<div class="grid">${lk.map(n=>card(n)).join("")}</div>`:`<div class="empty">마음에 드는 작품에 하트를 눌러 보세요.</div>`}</section>`;}

const notFound=m=>`<div class="sec"><div class="empty"><h3>${esc(m||"작품을 찾을 수 없어요")}</h3>삭제되었거나 아직 불러오는 중일 수 있어요.<div class="row"><button class="btn-soft" type="button" data-act="home">홈으로</button></div></div></div>`;

/* ---------- render ---------- */
function renderHeader(){const a=$("#authSlot");
  if(!S.authReady){a.innerHTML="";}
  else if(S.uid){a.innerHTML=`<button class="me" type="button" data-act="account"><span class="av">${esc((S.pen||"나").slice(0,1))}</span><span>${esc(S.pen||"필명 정하기")}</span></button>`;}
  else a.innerHTML=`<button class="btn-text" type="button" data-act="login">로그인</button><button class="btn" type="button" data-act="signup">회원가입</button>`;
  document.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.nav===S.view.name)));}
function render(){renderHeader();
  const v=S.view.name;const map={home:vHome,search:vSearch,novel:vNovel,reader:vReader,write:vWrite,ep:vEp,library:vLibrary};
  app.innerHTML=(map[v]||vHome)()+`<footer class="foot">먹과종이 · 회차가 1개 이상인 작품만 추천 목록에 올라가요.${API&&!API.online?"<br>지금은 설치 없이 쓰는 모드라 작품·계정이 이 브라우저에 저장돼요.":""}</footer>`;}
function patchHearts(){const all=allNovels(),m={};all.forEach(n=>m[n.id]=n.hearts);
  document.querySelectorAll("[data-hc]").forEach(el=>el.textContent=fmtN(m[el.dataset.hc]||0));
  document.querySelectorAll("[data-hb]").forEach(el=>{const on=liked(el.dataset.hb);el.setAttribute("aria-pressed",String(on));const s=el.querySelector("[data-hl]");if(s)s.textContent=on?"하트 취소":"하트";});}
function softRender(){if(["write","ep","reader"].includes(S.view.name)||(S.view.name==="novel"&&S.epDraft&&S.epDraft.id===S.view.id&&$("#writer"))){renderHeader();patchHearts();return;}render();}
function go(v){if(!(v.name==="novel"&&S.epDraft&&S.epDraft.id===v.id))S.epDraft=null;S.view=v;window.scrollTo(0,0);render();}

/* ---------- modal ---------- */
function modal(html){$("#modal").innerHTML=`<div class="ov" data-act="ovclose"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`;const f=$("#modal input")||$("#modal .panel button");if(f)f.focus();}
function closeModal(){$("#modal").innerHTML="";}
let askRes=null;
const ask=(msg,ok)=>new Promise(r=>{askRes=r;modal(`<h2>확인</h2><p>${esc(msg)}</p><div class="acts"><button class="btn-soft" type="button" data-act="askno">취소</button><button class="btn" type="button" data-act="askyes">${esc(ok||"확인")}</button></div>`);});
function authModal(mode){const su=mode==="signup";
  modal(`<div class="tabs"><button type="button" data-act="login" aria-pressed="${!su}">로그인</button><button type="button" data-act="signup" aria-pressed="${su}">회원가입</button></div>
  <form data-form="${su?"signup":"login"}" novalidate><h2>${su?"먹과종이 회원가입":"다시 오셨네요"}</h2><p>${su?"아이디와 비밀번호만 정하면 끝이에요. 이메일이나 실명은 필요 없어요.":"아이디와 비밀번호를 입력해 주세요."}</p>
  <div class="fld"><label for="lid">아이디 <span class="h">영어 소문자·숫자·_ 4~16자</span></label><input id="lid" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false"></div>
  <div class="fld"><label for="lpw">비밀번호 <span class="h">6자 이상</span></label><input id="lpw" type="password" autocomplete="${su?"new-password":"current-password"}" maxlength="64"></div>
  ${su?`<div class="fld"><label for="lpw2">비밀번호 확인</label><input id="lpw2" type="password" autocomplete="new-password" maxlength="64"></div>
  <div class="fld"><label for="lpen">필명 <span class="h">작품에 표시될 이름 · 16자까지</span></label><input id="lpen" maxlength="16"></div>`:""}
  <button class="btn btn-lg" type="submit" id="authBtn">${su?"가입하고 시작하기":"로그인"}</button>
  ${su?`<p class="fine">비밀번호는 찾을 수 없으니 꼭 기억해 주세요.</p>`:""}</form>`);}
function penModal(){const def=S.pen||(S.user&&S.user.displayName)||"";
  modal(`<form data-form="pen"><h2>필명 정하기</h2><p>작품과 함께 표시될 이름이에요. 나중에 바꿀 수 있어요.</p>
  <div class="fld"><label for="pen">필명</label><input id="pen" maxlength="16" value="${esc(String(def).slice(0,16))}"></div>
  <div class="acts"><button class="btn-soft" type="button" data-act="close">취소</button><button class="btn" type="submit">저장</button></div></form>`);}
function accountModal(){modal(`<h2>${esc(S.pen||"내 계정")}</h2><p>아이디 ${esc(S.loginId||"")}(으)로 로그인 중이에요.</p>
  <div class="acts"><button class="btn-soft" type="button" data-act="editpen">필명 바꾸기</button><button class="btn-soft" type="button" data-act="library">내 서재</button><button class="btn" type="button" data-act="logout">로그아웃</button></div>`);}

/* ---------- auth ---------- */

async function doAuth(su){const id=$("#lid").value.trim().toLowerCase(),pw=$("#lpw").value,btn=$("#authBtn");

function needLogin(after){if(!S.uid){S.after=after||null;authModal("login");return false;}if(!S.pen){S.after=after||null;penModal();return false;}return true;}

async function makeCover(file){const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const c=document.createElement("canvas");c.width=300;c.height=420;const x=c.getContext("2d");const r=Math.max(300/img.naturalWidth,420/img.naturalHeight);
    const w=img.naturalWidth*r,h=img.naturalHeight*r;x.fillStyle="#fff";x.fillRect(0,0,300,420);x.drawImage(img,(300-w)/2,(420-h)/2,w,h);
    return c.toDataURL("image/jpeg",0.8);}finally{URL.revokeObjectURL(url);}}

async function toggleHeart(id){if(!needLogin({act:"heart",id}))return;const n=findNovel(id);if(!n)return;
  if(n.aid===S.uid){toast("내 작품에는 하트를 줄 수 없어요.");return;}
  const was=liked(id);
  try{await API.heart(S.uid,id,!was);if(!was)toast("하트를 보냈어요. 인기 순위에 반영돼요.");}catch(e){toast(errMsg(e));}}

  if(!title){toast("소설 이름을 입력해 주세요.");$("#title").focus();return;}
  if(!d.preview){toast("표지 이미지를 등록해 주세요.");return;}
  S.busy=true;const btn=$("#saveNovel");btn.disabled=true;btn.textContent="저장 중…";
  try{const now=Date.now();let id=d.id;

    else{id=API.newId();const nd={authorId:S.uid,penName:S.pen,title,genre,synopsis,cover:d.preview,episodes:[],episodeCount:0,heartCount:0,createdAt:now,updatedAt:now};await API.createNovel(id,nd);S.novels[id]=Object.assign({},nd,S.novels[id]||{});}
    S.draft=null;if(d.id){toast("작품 정보를 저장했어요.");go({name:"novel",id});}else{toast("작품을 등록했어요. 바로 1화를 써 보세요!");openEpEditor(id,null);}}

async function submitEp(){if(S.busy)return;const e=S.epDraft||{},n=findNovel(e.id);if(!n)return;
  const title=$("#epTitle").value.trim(),body=$("#epBody").value;if(!body.trim()){toast("본문을 입력해 주세요.");$("#epBody").focus();return;}
  S.busy=true;const btn=$("#saveEp");btn.disabled=true;btn.textContent="저장 중…";
  try{const now=Date.now(),eid=e.eid||genId(),first=n.epCount===0&&!e.eid;
    const raw=(S.novels[n.id].episodes||[]).filter(x=>x&&x.id).map(x=>({id:x.id,title:String(x.title||""),at:Number(x.at)||now}));
    const i=raw.findIndex(x=>x.id===eid);if(i>=0)raw[i].title=title;else raw.push({id:eid,title,at:now});

/* canvas actions */
async function ptImport(file){if(!/^image\//.test(file.type)){toast("이미지 파일만 불러올 수 있어요.");return;}const url=URL.createObjectURL(file);

  if(e.key==="["){P.size=Math.max(1,P.size-2);ptSync();return;}if(e.key==="]"){P.size=Math.min(150,P.size+2);ptSync();return;}
  if(k==="x"){ptAction("swap");return;}
  const t=TOOLS.find(t=>t[2]===k);if(t)ptTool(t[0]);}

/* ---------- boot ---------- */
let API=null;
render();
(async()=>{
  if(CONFIGURED){try{API=await makeFirebaseAPI();}catch(e){API=null;toast("온라인 저장소에 연결하지 못해서 이 브라우저 저장 모드로 열었어요.");}}
  if(!API)API=makeLocalAPI();
  API.watchNovels(m=>{S.novels=m;S.loaded=true;S.err=false;softRender();},e=>{S.err=true;S.loaded=false;render();});
  API.watchWeek(w=>{S.week=w;softRender();});
  let unMine=null;
  API.onAuth(async u=>{S.uid=u?u.uid:null;S.loginId=u?u.loginId:"";S.authReady=true;S.mine=new Set();S.pen="";if(unMine){unMine();unMine=null;}
    if(u)unMine=API.watchMine(u.uid,set=>{S.mine=set;softRender();});
    if(u&&S.signingUp){render();return;}
    if(u){try{const p=await API.getUser(u.uid);S.pen=p?String(p.penName||""):"";}catch(e){}
      if(!S.pen)penModal();else runAfter();}
    else if(["library","write","ep"].includes(S.view.name))S.view={name:"home"};
    render();});
})();
</script>
